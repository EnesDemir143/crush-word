name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Crush Word ${{ github.ref_name }}
          body: |
            ## Crush Word ${{ github.ref_name }}

            Single-player Turkish word puzzle game built with Flutter.

            ### Installation
            Download the APK below and install it on your Android device.
            If prompted, enable "Install from unknown sources" in your device settings.
          files: build/app/outputs/flutter-apk/app-release.apk
